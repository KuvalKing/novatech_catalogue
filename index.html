<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaTech Catalogue</title>
<style>
:root{--bg:#05060b;--line:#1a2140;--text:#f1f5ff;--muted:#9aa3bd;--grad:linear-gradient(90deg,#22d3ee,#3b82f6,#c026d3)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
header img{height:72px;width:auto;display:block}
.brand{font-size:1.6rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:12px}
footer{text-align:center;padding:24px 16px;color:var(--muted);border-top:1px solid var(--line);font-size:.95rem}
.wrap{max-width:720px;margin:0 auto}
.section{padding:14px 16px;font-size:.9rem;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.item{display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--line)}
.thumb{width:96px;height:96px;flex:0 0 96px;border-radius:12px;object-fit:cover;background:#000}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.name{font-size:1.02rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc{font-size:.88rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.price{font-size:.98rem;font-weight:700}
.btn{text-decoration:none;font-weight:700;font-size:.9rem;color:#05060b;background:var(--grad);border-radius:8px;padding:7px 16px;white-space:nowrap}
.btn.alt{background:none;color:var(--text);border:1px solid #3b82f6}
</style>
</head>
<body>
<header><img id="logo" alt="Novatech logo"><span class="brand">Novatech</span></header>

<div class="wrap">
  <div class="section">All items</div>
  <main id="catalog"></main>
</div>

<footer>Where ideas meet technology and innovation.</footer>
